name: Generate Changelog

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"   # runs only when you create a tag like v1.0.0

permissions:
  contents: write
  pull-requests: read

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------
      # 1. Checkout full repo history
      # ------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------
      # 1.1 Debug Steps
      # ------------------------------
      # Add these steps before the "Generate changelog" step in your existing job
      - name: Debug: fetch tags & show recent tags/commits
        run: |
          git fetch --tags
          echo "==== tags (most recent 10) ===="
          git tag --sort=-creatordate | sed -n '1,10p' || true
          echo ""
          echo "==== last 50 commits ===="
          git log --oneline -n 50 || true

      - name: Debug: show PR numbers referenced in recent commits
        run: |
          echo "PR numbers found in recent commits (grep '#<num>'):"
          git log --oneline -n 200 | grep -Eo '#[0-9]+' | sort -u || echo "No PR numbers found in recent commits"

      - name: Debug: install jq (for pretty API output)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
        shell: bash

      - name: Debug: list last 100 closed PRs targeting main (shows merged_at)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "==== last 100 closed PRs targeting main (number, merged_at, title) ===="
          curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=main&per_page=100" \
            | jq -r '.[] | "\(.number) \(.merged_at) \(.title)"' || true

      - name: Debug: show changelog config file
        run: |
          echo "==== .github/changelog-config.json content (if exists) ===="
          if [ -f .github/changelog-config.json ]; then
            cat .github/changelog-config.json
          else
            echo "[not found]"
          fi


      # ------------------------------
      # 2. Generate changelog (from PRs + commits)
      # ------------------------------
      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: ".github/changelog-config.json"
          fromTag: ""  # ensures first tag works correctly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------
      # 3. Create or update GitHub Release
      # ------------------------------
      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      # ------------------------------
      # 4. Update local CHANGELOG.md
      # ------------------------------
      - name: Update CHANGELOG.md file
        run: |
          echo "## ${{ github.ref_name }}" >> CHANGELOG.md
          echo "${{ steps.changelog.outputs.changelog }}" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(changelog): update for ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin HEAD:main
